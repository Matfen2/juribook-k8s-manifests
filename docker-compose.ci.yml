services:

  # ── Infrastructure ────────────────────────────────────────────────

  kafka:
    image: apache/kafka:3.7.0
    container_name: juribook-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres-auth:
    image: postgres:16-alpine
    container_name: juribook-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      retries: 10

  postgres-lawyer:
    image: postgres:16-alpine
    container_name: juribook-postgres-lawyer
    environment:
      POSTGRES_DB: lawyer_db
      POSTGRES_USER: lawyer_user
      POSTGRES_PASSWORD: lawyer_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawyer_user -d lawyer_db"]
      interval: 5s
      retries: 10

  postgres-booking:
    image: postgres:16-alpine
    container_name: juribook-postgres-booking
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      retries: 10

  postgres-notification:
    image: postgres:16-alpine
    container_name: juribook-postgres-notification
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notif_db"]
      interval: 5s
      retries: 10

  postgres-audit:
    image: postgres:16-alpine
    container_name: juribook-postgres-audit
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_db"]
      interval: 5s
      retries: 10

  # ── Microservices (profil : services) ────────────────────────────

  auth-service:
    image: ghcr.io/matfen2/juribook-auth-service:latest
    container_name: juribook-auth
    profiles: [services]
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  lawyer-service:
    image: ghcr.io/matfen2/juribook-lawyer-service:latest
    container_name: juribook-lawyer
    profiles: [services]
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-lawyer:5432/lawyer_db
      SPRING_DATASOURCE_USERNAME: lawyer_user
      SPRING_DATASOURCE_PASSWORD: lawyer_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres-lawyer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  booking-service:
    image: ghcr.io/matfen2/juribook-booking-service:latest
    container_name: juribook-booking
    profiles: [services]
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-booking:5432/booking_db
      SPRING_DATASOURCE_USERNAME: booking_user
      SPRING_DATASOURCE_PASSWORD: booking_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres-booking:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  notification-service:
    image: ghcr.io/matfen2/juribook-notification-service:latest
    container_name: juribook-notification
    profiles: [services]
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notif_db
      SPRING_DATASOURCE_USERNAME: notif_user
      SPRING_DATASOURCE_PASSWORD: notif_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  audit-service:
    image: ghcr.io/matfen2/juribook-audit-service:latest
    container_name: juribook-audit
    profiles: [services]
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-audit:5432/audit_db
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: audit_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres-audit:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api-gateway:
    image: ghcr.io/matfen2/juribook-api-gateway:latest
    container_name: juribook-gateway
    profiles: [services]
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-ci_secret_key_64chars_minimum_pour_hs256_algorithme_ok}
      AUTH_SERVICE_URL: http://auth-service:8081
      LAWYER_SERVICE_URL: http://lawyer-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      AUDIT_SERVICE_URL: http://audit-service:8085
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      auth-service:
        condition: service_healthy
      lawyer-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s