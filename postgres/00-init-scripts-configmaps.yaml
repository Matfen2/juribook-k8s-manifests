# ═══════════════════════════════════════════════════════════
#  Scripts d'init SQL des 5 bases, montés dans
#  /docker-entrypoint-initdb.d au démarrage de chaque pod
#  Postgres.
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-authdb-sql
  namespace: juribook
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

