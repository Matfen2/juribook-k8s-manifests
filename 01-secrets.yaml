# ═══════════════════════════════════════════════════════════
#  Secrets JuriBook
#
#  ⚠️ NE JAMAIS committer ce fichier avec de vraies valeurs.
#  Les placeholders ci-dessous ("juribook" et un JWT de dev)
#  sont à remplacer avant tout déploiement réel.
#
#  Pour générer une valeur encodée en base64 :
#    echo -n "ma_valeur" | base64
#
#  Préfère créer le secret directement en CLI (jamais dans un
#  fichier versionné) :
#    kubectl create secret generic postgres-credentials \
#      --namespace juribook \
#      --from-literal=POSTGRES_USER=juribook \
#      --from-literal=POSTGRES_PASSWORD='<mot-de-passe-fort>'
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: juribook
type: Opaque
data:
  POSTGRES_USER: anVyaWJvb2s=       # "juribook"
  POSTGRES_PASSWORD: anVyaWJvb2s=   # "juribook" — À CHANGER

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: juribook
type: Opaque
data:
  # Valeur de dev, min. 256 bits une fois décodée. Régénère avec :
  #   openssl rand -base64 64 | base64
  JWT_SECRET: ZGV2LWp3dC1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluLTI1Ni1iaXRz
