# ═══════════════════════════════════════════════════════════
#  Secrets de PRODUCTION
#
#  ⚠️ NE JAMAIS committer ce fichier avec de vraies valeurs.
#
#  POSTGRES_PASSWORD doit être IDENTIQUE à db_prod_app_password
#  dans terraform.tfvars (dépôt juribook-terraform) — c'est le
#  mot de passe de l'utilisateur RDB "juribook_prod", DISTINCT
#  de l'utilisateur "juribook" du staging.
#
#  Préfère créer ces secrets directement en CLI (jamais dans un
#  fichier versionné) :
#    kubectl create secret generic postgres-credentials \
#      --namespace juribook-production \
#      --from-literal=POSTGRES_USER=juribook_prod \
#      --from-literal=POSTGRES_PASSWORD='<mot-de-passe-fort>'
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: juribook-production
type: Opaque
data:
  POSTGRES_USER: anVyaWJvb2tfcHJvZA==   # "juribook_prod"
  POSTGRES_PASSWORD: anVyaWJvb2s=       # placeholder — À CHANGER

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: juribook-production
type: Opaque
data:
  # ⚠️ Utilise un JWT_SECRET DIFFÉRENT de celui du staging en
  # production réelle — celui-ci n'est qu'un placeholder de dev.
  # Régénère avec : openssl rand -base64 64 | base64
  JWT_SECRET: ZGV2LWp3dC1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluLTI1Ni1iaXRz
