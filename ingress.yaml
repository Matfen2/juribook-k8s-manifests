# ═══════════════════════════════════════════════════════════
#  Ingress — point d'entrée public unique du cluster.
#  Seul api-gateway est exposé ; les 5 microservices backend
#  restent en ClusterIP, injoignables depuis l'extérieur.
#
#  ⚠️ Suppose un Ingress Controller nginx déjà installé :
#    Minikube : minikube addons enable ingress
#    Cluster générique : kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
# ═══════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juribook-ingress
  namespace: juribook
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: juribook.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

    - host: mailhog.juribook.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailhog
                port:
                  number: 8025
